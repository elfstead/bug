[package]
name = "bug"
version = "0.0.0-dev"
publish = false
edition = "2024"
description = "A programmable, page-only Ladybird host"
license = "BSD-2-Clause"

[features]
default = ["windowed"]
windowed = ["dep:winit", "dep:softbuffer", "dep:font8x8", "dep:arboard", "dep:smithay-clipboard"]

[dependencies]
libloading = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = { version = "0.4", optional = true }
font8x8 = { version = "0.3", optional = true }
arboard = { version = "3.6", default-features = false, optional = true }
winit = { version = "0.30", optional = true, default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-clipboard = { version = "0.7", optional = true }

[profile.release]
lto = "thin"
